name: Deploy to Cloudflare

# Publishes the site as the Cloudflare Worker "gdn-ktn-bund" (see wrangler.jsonc) after every merge to main.
# It does nothing until the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set.
# Pull requests are already checked by pr-checks.yml, and main only receives pull requests.
on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip without Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping the Cloudflare deploy"
      - name: Checkout
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v6
      - name: Set up Node
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install and build
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci && npm run build
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
