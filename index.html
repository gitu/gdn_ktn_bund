<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f8" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Finanzdaten von Schweizer Gemeinden, Kantonen und dem Bund vergleichen – Swiss Financial Data Explorer."
    />
    <title>GDN KTN BUND – Finanzdaten-Explorer</title>
    <style>
      /* Paint the right background before the app mounts (no white flash in dark mode). */
      html { background: #f3f5f8; }
      html.app-dark { background: #0a0f18; }
    </style>
    <script>
      // Apply the stored or OS theme before first paint. Mirrors resolveInitialDarkTheme().
      (function () {
        try {
          var stored = localStorage.getItem('gk-theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.classList.add('app-dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0a0f18');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

    <script>
        // Redirects user from 404
        (function () {
            var redirect = sessionStorage.redirect;
            delete sessionStorage.redirect;
            if (redirect && redirect != location.href) {
                history.replaceState(null, null, redirect);
            }
        })();
    </script>
  </body>
</html>
